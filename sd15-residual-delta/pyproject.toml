[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sd15-residual-delta"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.4,<2.5", "numpy>=1.26", "tqdm>=4.66"]

[project.optional-dependencies]
evaluation = [
  "lpips==0.1.4",
  "scikit-image==0.26.0",
  "numpy==1.26.4",
  "scipy==1.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
